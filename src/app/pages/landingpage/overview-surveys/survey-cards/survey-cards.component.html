<div class="card_wrapper">

        <div class="card_wrapper--text">
                <p class="survey_card--category">{{ survey.category }}</p>
                <h3 class="survey_card--title survey-title">{{ survey.name }}</h3>
        </div>
        <div class="card_wrapper--expire displayflex_space--end">
                <div class="survey_card--expire displayflex_center">
                        @if(getDaysLeft() > 0) {
                        <span>Ends in {{ getDaysLeft() }} days</span>
                        } @else {
                        <span>Expired</span> <!-- ← wenn Datum in der Vergangenheit -->
                        }
                </div>
        </div>
</div>
