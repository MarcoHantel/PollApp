<div class="overview_surveys--container">

    <div class="overview_surveys--head displayflex_space--between">
        <div class="button_wrapper displayflex_space--between">
            <button class="btn_select btn_active">Active survey</button>
            <button class="btn_select btn_past">Past survey</button>
        </div>


        <!-- statt <select> ein eigenes Dropdown bauen -->

        <div class="custom_select">
            <div class="custom_select--selected displayflex_space--between" (click)="toggleDropdown()">
                {{ selected }} <span class="arrow" [class.open]="isOpen"></span>
            </div>
            @if(isOpen) {
            <ul class="custom_select--options">

                @for(option of options; track option.value) {

                <li class="custom_select--option" (click)="selectOption(option)">
                    <p class="custom_select--option--text"> {{ option.label}}</p>
                </li>
                }
            </ul>
            }
        </div>

    </div>

</div>
