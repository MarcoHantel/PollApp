<div class="overview_surveys--container">

    <div class="overview_surveys--head displayflex_space--between">
        <div class="button_wrapper displayflex_space--between">
            <button class="btn_select btn_active" (click)="surveyCreateService.setStatus('active')"
                [class.btn_active--selected]="surveyCreateService.selectedStatus() === 'active'">
                Active survey
            </button>
            <button class="btn_select btn_past" (click)="surveyCreateService.setStatus('past')"
                [class.btn_past--selected]="surveyCreateService.selectedStatus() === 'past'">
                Past survey
            </button>
        </div>


        <!-- statt <select> ein eigenes Dropdown bauen -->

        <div class="custom_select">
            <div class="custom_select--selected displayflex_space--between" (click)="dropDown.toggleDropdown()">
                {{ dropDown.selected }} <span class="arrow" [class.open]="dropDown.isOpen"></span>
            </div>
            @if(dropDown.isOpen) {
            <ul class="custom_select--options">

                @for(option of dropDown.categoryOptions; track option.value) {

                <li class="custom_select--option"
                    (click)="dropDown.selectOption(option); surveyCreateService.setCategory(option.value)">
                    <p class="custom_select--option--text">{{ option.label }}</p>
                </li>
                }
            </ul>
            }
        </div>

    </div>

    <div class="all_cards_wrapper">
        @for(survey of surveyCreateService.filteredSurveys(); track survey.id) {
        <app-survey-cards [survey]="survey"></app-survey-cards>
        }
    </div>

</div>
