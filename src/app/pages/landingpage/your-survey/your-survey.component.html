<div class="your_survey--container">

    <h2 class="styling_h2 position_center">Your surveys</h2>
    <p class="basic_text--big">Ending soon surveys</p>

    <div class="card_wrapper">
        @for (item of currentSurveys; track $index) {
        <!-- Die Karte wird hier eingefügt Loop -->
        <app-survey-card class="survey_card" [survey]="$any(item)" />

        } @empty {
        <p>No surveys available!</p>
        }
    </div>

</div>
